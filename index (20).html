:root{
  --ink:#1b2733; --head:#243b53; --accent:#2f6fb3; --accent-dark:#1f4f84; --line:#b9c4cf; --soft:#eef3f8;
  --page:#ffffff; --read:#ffe9a8; --flag:#c2410c;
  --fs:22px; --lh:1.7; --ls:0.01em; --ws:0.06em;
  --font:'Lexend','Arial','Helvetica',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);text-align:left;font-style:normal;text-transform:none}
body.bg-cream{--page:#fbf3dc} body.bg-blue{--page:#e3effa} body.bg-gray{--page:#e9ebee}
body.f-lexend{--font:'Lexend','Arial',sans-serif}
body.f-dys{--font:'OpenDyslexic','Lexend','Arial',sans-serif}
body.f-arial{--font:Arial,Helvetica,sans-serif}
#app{display:flex;flex-direction:column;min-height:100%}
button{font:inherit;letter-spacing:inherit;word-spacing:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--accent);background:#fff;color:var(--accent-dark);padding:.35em .8em;min-height:44px;line-height:1.2}
button:hover{background:var(--soft)}
button:focus-visible,.w:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark)}
button[disabled]{opacity:.45;cursor:default}
button[aria-pressed="true"]{background:var(--accent);color:#fff}
#hdr{background:var(--head);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.5rem 1rem;font-size:16px;line-height:1.3}
#hdr .title{font-weight:600;flex:1 1 220px}
#hdr .qn{font-weight:600}
#hdr .timer{background:#fff;color:var(--head);border-radius:6px;padding:.25em .7em;font-weight:600}
#hdr button{min-height:40px;font-size:15px;border-color:#fff;background:transparent;color:#fff;padding:.25em .7em}
#hdr button:hover{background:rgba(255,255,255,.18)}
main{flex:1;padding:1rem 1.2rem 6rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.4rem;max-width:1400px;margin:0 auto}
.split.single{grid-template-columns:minmax(0,820px);justify-content:center}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.stim{border:2px solid var(--line);border-radius:10px;background:#fff;padding:.8rem;align-self:start;position:sticky;top:.6rem}
.stim img{display:block;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in;background:#fff}
.stim .hint{font-size:.7em;margin:.5rem 0 0;color:#40546a}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem;padding:.6rem;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.tools .spd{display:flex;gap:.3rem;align-items:center;margin-left:auto;font-size:.75em}
.tools button{font-size:.75em}
.qhead{display:flex;justify-content:flex-end;margin-bottom:.4rem}
.flagbtn{font-size:.75em}
.line{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border-radius:10px;margin:.2rem 0;border:2px solid transparent}
.line.reading{background:var(--read);border-color:#e0b43a}
.line .txt{flex:1;min-width:0;overflow-wrap:anywhere;margin:0}
.spk{flex:0 0 auto;min-height:40px;min-width:40px;padding:.2em .5em;font-size:.7em}
.pre{font-weight:600}
ul.choices{list-style:none;padding:0;margin:.8rem 0 0}
li.choice{border:2px solid var(--line);background:#fff;margin:.9rem 0;padding:.85rem .9rem;min-height:4.2rem;align-items:center}
li.choice.reading{background:var(--read);border-color:#e0b43a}
.letter{flex:0 0 auto;width:2.2em;height:2.2em;border-radius:50%;border:2px solid var(--head);display:inline-flex;align-items:center;justify-content:center;font-weight:600;background:#fff;color:var(--head)}
.blank{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--ink);margin:0 .15em;height:1em;vertical-align:baseline}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{background:#dbe8f6}
body.nohelp .w{cursor:default}
body.nohelp .w:hover{background:none}
footer.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:space-between;gap:1rem;padding:.6rem 1rem;z-index:20}
footer.nav button{min-width:130px;font-size:.8em}
.panel{position:fixed;inset:0;background:rgba(20,30,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.panel[hidden]{display:none}
.box{background:#fff;color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:1.2rem 1.4rem;font-size:18px;line-height:1.6;letter-spacing:normal;word-spacing:normal}
.box h2{margin:.1rem 0 .8rem;font-size:1.25em}
.opt{margin:.9rem 0}
.opt .lab{font-weight:600;margin-bottom:.35rem}
.opt .row{display:flex;flex-wrap:wrap;gap:.4rem}
.opt button{font-size:.9em;min-height:42px}

  Object.keys(OPT_DEFS).forEach(function(k){

    OPT_DEFS[k].forEach(function(p){
      var bt=document.createElement("button"); bt.type="button"; bt.textContent=p[0];
      bt.setAttribute("aria-pressed", String(opts[k]===p[1]));
      bt.onclick=function(){opts[k]=p[1];saveOpts();applyOpts();buildOptUI()};
      row.appendChild(bt);
    });
  });
}

/* ---------- state ---------- */
var params=new URLSearchParams(location.search);
var st=null;            // {startedAt, mins, q, flags:[], seen:[]}
var screen="start";     // start | q | end | time
var cur=0;
var tick=null;

function now(){return Date.now()}
function endTime(){return st.startedAt+st.mins*60000}
function saveSt(){if(st)sset(K_STATE,JSON.stringify(st))}

function initState(){
  if(params.get("reset")===RESET_WORD){sdel(K_STATE);sdel(K_LOCK);
    try{history.replaceState(null,"",location.pathname+(params.get("min")?"?min="+encodeURIComponent(params.get("min")):""))}catch(e){}
  }
  var lock=parseInt(sget(K_LOCK)||"0",10);
  if(lock && now()<lock){screen="time";return}
  if(lock && now()>=lock){sdel(K_LOCK);sdel(K_STATE)}
  st=jget(K_STATE);
  if(st){
    if(now()>=endTime()){expire();return}
    cur=Math.min(Math.max(st.q||0,0),TOTAL-1); screen="q";
  }
}
function expire(){
  stopSpeech();
  ["optPanel","gridPanel","zoom","def"].forEach(function(id){var n=document.getElementById(id);if(n)n.hidden=true});
  sset(K_LOCK,String(now()+LOCK_HOURS*3600000));
  screen="time"; render();
}
function minsFromUrl(){
  var m=parseInt(params.get("min"),10);
  if(isNaN(m))return DEFAULT_MIN;
  return Math.min(180,Math.max(10,m));
}
function startTest(){
  st={startedAt:now(),mins:minsFromUrl(),q:0,flags:[],seen:[]};
  saveSt(); cur=0; screen="q"; render();
}

/* ---------- speech ---------- */
var synth=window.speechSynthesis||null;
var voice=null;
function pickVoice(){
  if(!synth)return;
  var vs=synth.getVoices(); if(!vs.length)return;
  voice=vs.filter(function(v){return /^en[-_]US/i.test(v.lang)&&/google|natural|samantha|microsoft/i.test(v.name)})[0]
     ||vs.filter(function(v){return /^en[-_]US/i.test(v.lang)})[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null;
}
if(synth){pickVoice();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=pickVoice}
var RATES={slow:0.7,normal:0.92,fast:1.15};
var rd={idx:-1,token:0,active:false,paused:false,single:false};

function clearHL(){[].forEach.call(document.querySelectorAll(".line.reading"),function(e){e.classList.remove("reading")})}
function stopSpeech(){
  rd.token++; rd.active=false; rd.paused=false; rd.idx=-1; rd.single=false;
  if(synth){try{synth.cancel()}catch(e){}}
  clearHL(); updateReadBtn();
}
function lineEls(){return [].slice.call(document.querySelectorAll("#main .line"))}
function sayText(t){
  return t.replace(/_{3,}/g,"blank").replace(/#Gains/g,"hashtag Gains").replace(/\betc\./g,"et cetera.")
          .replace(/\s*\(([A-Za-z]{1,2})\)/g,", $1").replace(/\b(\d+)-yard/g,"$1 yard");
}
function speakRaw(text,onend){
  if(!synth){return}
  var u=new SpeechSynthesisUtterance(text);
  u.rate=RATES[opts.speed]||0.92; u.lang="en-US"; if(voice)u.voice=voice;
  u.onend=onend||null; u.onerror=onend?function(e){if(e&&e.error!=="canceled"&&e.error!=="interrupted")onend()}:null;
  synth.speak(u);
}
function speakIdx(i,single){
  var els=lineEls(); if(!els.length||!synth)return;
  i=Math.max(0,Math.min(els.length-1,i));
  rd.token++; var my=rd.token;
  try{synth.cancel();synth.resume()}catch(e){}
  rd.idx=i; rd.active=true; rd.paused=false; rd.single=!!single;
  clearHL(); var el=els[i]; el.classList.add("reading");
  try{el.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
  updateReadBtn();
  setTimeout(function(){
    if(my!==rd.token)return;
    speakRaw(el.getAttribute("data-say"),function(){
      if(my!==rd.token)return;
      if(rd.single||i>=els.length-1){stopSpeech()}else{speakIdx(i+1,false)}
    });
  },70);
}
function updateReadBtn(){
  var b=document.getElementById("rdMain"); if(!b)return;
  if(rd.active&&!rd.paused)b.textContent="Pause";
  else if(rd.active&&rd.paused)b.textContent="Resume";
  else b.textContent="Read to me";
}
function onReadMain(){
  if(!synth)return;
  if(!rd.active){speakIdx(0,false)}
  else if(rd.paused){rd.paused=false;try{synth.resume()}catch(e){};updateReadBtn()}
  else{rd.paused=true;try{synth.pause()}catch(e){};updateReadBtn()}
}
function speedChange(s){
  opts.speed=s; saveOpts();
  [].forEach.call(document.querySelectorAll("[data-speed]"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-speed")===s))});
  if(rd.active&&!rd.paused&&rd.idx>=0)speakIdx(rd.idx,rd.single);
}
window.addEventListener("pagehide",function(){if(synth)try{synth.cancel()}catch(e){}});

/* ---------- text rendering with tap-a-word ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function isSymbol(w,txt,idx){
  if(/^[A-Z]$/.test(w))return true;
  if(/^[A-Z][a-z]$/.test(w)&&txt.charAt(idx-1)==="(")return true;
  return false;
}
function renderText(txt){
  var out="",last=0,m; WORD.lastIndex=0;
  var blankRe=/_{3,}/g;
  // split on blanks first
  var parts=txt.split(/(_{3,})/);
  var pos=0;
  parts.forEach(function(p){
    if(/^_{3,}$/.test(p)){out+='<span class="blank" role="img" aria-label="blank"></span>';pos+=p.length;return}
    var l=0; WORD.lastIndex=0; var mm;
    while((mm=WORD.exec(p))){
      out+=esc(p.slice(l,mm.index));
      var w=mm[0];
      if(isSymbol(w,p,mm.index)){out+=esc(w)}
      else{out+='<span class="w" role="button" tabindex="0" data-w="'+esc(w.toLowerCase())+'">'+esc(w)+'</span>'}
      l=mm.index+w.length;
    }
    out+=esc(p.slice(l)); pos+=p.length;
  });
  return out;
}
function showDef(word,disp){
  if(opts.help!=="on")return;
  var box=document.getElementById("def");
  document.getElementById("defW").textContent=disp||word;
  var d=document.getElementById("defD"), hear=document.getElementById("defHear");
  if(VOCAB.indexOf(word)>-1||!DEFS[word]){
    d.textContent="No definition for this word."; hear.style.display="none"; box.removeAttribute("data-say");
  }else{
    d.textContent=DEFS[word]; hear.style.display=""; box.setAttribute("data-say",(disp||word)+". "+DEFS[word]);
  }
  box.hidden=false;
}
function hideDef(){document.getElementById("def").hidden=true; if(synth&&!rd.active)try{synth.cancel()}catch(e){}}

/* ---------- views ---------- */
var main=document.getElementById("main"), nav=document.getElementById("nav");
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function mkSpk(label){var b=el("button","spk","Hear");b.type="button";b.setAttribute("aria-label",label);return b}
function mkLine(cls,say,html,spkLabel){
  var d=el("div","line "+cls); d.setAttribute("data-say",say);
  var p=el("p","txt",html); d.appendChild(p);
  var b=mkSpk(spkLabel); d.appendChild(b);
  b.onclick=function(){
    var els=lineEls(); speakIdx(els.indexOf(d),true);
  };
  return d;
}
function setNav(left,right){
  nav.innerHTML="";
  var l=el("button","",left.t);l.type="button";l.onclick=left.f; if(left.dis)l.disabled=true;
  nav.appendChild(l);
  if(right){var r=el("button","primary",right.t);r.type="button";r.onclick=right.f;nav.appendChild(r)}else{nav.appendChild(el("span"))}
}
function markSeen(i){if(st&&st.seen.indexOf(i)<0){st.seen.push(i);saveSt()}}

function go(i){
  stopSpeech();hideDef();
  if(i<0){screen="start";render();return}
  if(i>=TOTAL){screen="end";render();return}
  cur=i;screen="q";st.q=i;markSeen(i);saveSt();render();window.scrollTo(0,0);
}

function renderStart(){
  document.getElementById("qn").textContent="";
  var c=el("div","card");
  var started=!!st;
  c.innerHTML='<h1>Unit 3 Test: Chemistry of Life and Digestion</h1>'+
   '<p><b>Directions:</b> Select the best answer for each problem.</p>'+
   '<ul><li>Mark your answers on your paper answer sheet. You do not click answers here.</li>'+
   '<li>There are '+TOTAL+' questions. Each question is on its own screen.</li>'+
   '<li>Tap Read to me to hear a question. Tap Hear to hear one part again.</li>'+
   '<li>Tap any word to see what it means.</li>'+
   '<li>Tap Reading Options to change the size, font, spacing, and color.</li>'+
   '<li>Tap Questions to jump to any question. Use Flag if you want to come back.</li>'+
   (started?'':'<li>You have '+minsFromUrl()+' minutes. The timer starts when you press Start quiz.</li>')+'</ul>';
  var row=el("div","");row.style.marginTop="1rem";
  var b=el("button","primary",started?"Back to the test":"Start quiz");b.type="button";
  b.onclick=function(){started?go(cur):startTest()};
  row.appendChild(b);c.appendChild(row);
  main.innerHTML="";main.appendChild(c);
  nav.innerHTML="";
  document.getElementById("timer").style.display=started?"":"none";
  document.getElementById("btnGrid").style.display=started?"":"none";
}

function renderQ(){
  var q=QS[cur], n=cur+1;
  document.getElementById("qn").textContent="Question "+n+" of "+TOTAL;
  document.getElementById("timer").style.display="";
  document.getElementById("btnGrid").style.display="";
  var wrap=el("div","split"+(q.img?"":" single"));
  if(q.img){
    var s=el("section","stim");
    var im=el("img");im.src=IMGS[q.img];im.alt=q.alt||"Diagram";im.onclick=function(){openZoom(im)};
    s.appendChild(im);
    s.appendChild(el("p","hint","Tap the picture to make it bigger."));
    wrap.appendChild(s);
  }
  var p=el("section","qpane");
  // flag
  var fh=el("div","qhead");
  var fb=el("button","flagbtn");fb.type="button";
  function fl(){var on=st.flags.indexOf(cur)>-1;fb.textContent=on?"Flagged for review":"Flag for review";fb.setAttribute("aria-pressed",String(on))}
  fb.onclick=function(){var i=st.flags.indexOf(cur);if(i>-1)st.flags.splice(i,1);else st.flags.push(cur);saveSt();fl()};
  fl();fh.appendChild(fb);p.appendChild(fh);
  // reader tools
  var t=el("div","tools");
  var rm=el("button","primary","Read to me");rm.id="rdMain";rm.type="button";rm.onclick=onReadMain;t.appendChild(rm);
  var bk=el("button","","Back a line");bk.type="button";bk.onclick=function(){speakIdx(rd.active?rd.idx-1:0,false)};t.appendChild(bk);
  var nx=el("button","","Next line");nx.type="button";nx.onclick=function(){speakIdx(rd.active?rd.idx+1:0,false)};t.appendChild(nx);
  var sp=el("button","","Stop");sp.type="button";sp.onclick=stopSpeech;t.appendChild(sp);
  var spd=el("div","spd");spd.appendChild(el("span","","Speed:"));
  [["Slow","slow"],["Normal","normal"],["Fast","fast"]].forEach(function(x){
    var b=el("button","",x[0]);b.type="button";b.setAttribute("data-speed",x[1]);b.setAttribute("aria-pressed",String(opts.speed===x[1]));
    b.onclick=function(){speedChange(x[1])};spd.appendChild(b);
  });
  t.appendChild(spd);
  if(!synth){t.appendChild(el("p","","Read aloud is not available in this browser."))}
  p.appendChild(t);
  if(q.pre)p.appendChild(mkLine("pre",sayText(q.pre),renderText(q.pre),"Hear the directions"));
  var stemLine=mkLine("stem",(q.match?"":"Question "+n+". ")+sayText(q.stem),renderText(q.stem),"Hear the question");
  if(!q.match)p.appendChild(stemLine);
  var ul=el("ul","choices");
  var L="ABCDEFG";
  q.ch.forEach(function(c,i){
    var li=el("li","line choice");
    var say=q.match?(L[i]+". "+sayText(c)):((c.length===1&&/[A-Z]/.test(c))?("Choice "+L[i]+": the letter "+c+"."):("Choice "+L[i]+": "+sayText(c)));
    li.setAttribute("data-say",say);
    var b=mkSpk("Hear choice "+L[i]);
    li.appendChild(el("span","letter",L[i]));
    li.appendChild(el("p","txt",renderText(c)));
    li.appendChild(b);
    b.onclick=function(){speakIdx(lineEls().indexOf(li),true)};
    ul.appendChild(li);
  });
  p.appendChild(ul);
  if(q.match)p.appendChild(stemLine);
  wrap.appendChild(p);
  main.innerHTML="";main.appendChild(wrap);
  setNav({t:"Back",f:function(){go(cur-1)}},{t:cur===TOTAL-1?"Next":"Next",f:function(){go(cur+1)}});
  updateReadBtn();
}

function buildGrid(target,closeFn){
  target.innerHTML="";
  for(var i=0;i<TOTAL;i++){(function(i){
    var b=el("button","gbtn"+(screen==="q"&&i===cur?" cur":"")+(st&&st.seen.indexOf(i)>-1?" seen":"")+(st&&st.flags.indexOf(i)>-1?" fl":""),String(i+1));
    b.type="button";b.setAttribute("aria-label","Question "+(i+1)+(st&&st.flags.indexOf(i)>-1?", flagged":""));
    b.onclick=function(){if(closeFn)closeFn();go(i)};
    target.appendChild(b);
  })(i)}
}
function renderEnd(){
  document.getElementById("qn").textContent="All questions";
  var c=el("div","card");
  c.innerHTML="<h1>You have seen all "+TOTAL+" questions</h1><p>Check your paper answer sheet. Make sure every question has an answer. Tap a number to go back to that question.</p>";
  var g=el("div","grid");buildGrid(g,null);c.appendChild(g);
  c.appendChild(el("p","legend","A gray box means you have seen it. An orange corner means you flagged it."));
  main.innerHTML="";main.appendChild(c);
  setNav({t:"Back",f:function(){go(TOTAL-1)}},null);
}
function renderTime(){
  document.getElementById("hdr").style.display="none";nav.style.display="none";
  main.innerHTML='<div class="timeup"><div class="card"><h1>Time is up</h1><p>Please stop working. Your teacher will tell you what to do next.</p></div></div>';
  main.style.padding="0";
}
function render(){
  if(screen==="time"){renderTime();return}
  if(screen==="start")renderStart();
  else if(screen==="q")renderQ();
  else if(screen==="end")renderEnd();
  updateTimer();
}

/* ---------- timer ---------- */
function updateTimer(){
  var t=document.getElementById("timer");
  if(!st){t.style.display="none";return}
  var left=endTime()-now();
  if(left<=0){expire();return}
  var m=Math.ceil(left/60000);
  t.textContent=(m<=1?"Less than 1 min left":m+" min left");
}
function startTicker(){
  if(tick)clearInterval(tick);
  tick=setInterval(function(){if(st&&screen!=="time")updateTimer()},1000);
}

/* ---------- panels ---------- */
function openPanel(id){document.getElementById(id).hidden=false}
function closePanel(id){document.getElementById(id).hidden=true}
function openZoom(img){document.getElementById("zoomImg").src=img.src;document.getElementById("zoomImg").alt=img.alt;openPanel("zoom")}

/* ---------- line focus bar ---------- */
var fa=document.getElementById("fa"), fb=document.getElementById("fb");
function moveFocus(y){
  if(opts.focus!=="on")return;
  var h=Math.max(60,parseInt(opts.size,10)*2.6);
  var top=Math.max(0,y-h/2);
  fa.style.display=fb.style.display="block";
  fa.style.top="0";fa.style.height=top+"px";
  fb.style.top=(top+h)+"px";fb.style.bottom="0";
}
window.addEventListener("mousemove",function(e){moveFocus(e.clientY)});
window.addEventListener("touchmove",function(e){if(e.touches[0])moveFocus(e.touches[0].clientY)},{passive:true});
window.addEventListener("touchstart",function(e){if(e.touches[0])moveFocus(e.touches[0].clientY)},{passive:true});

/* ---------- events ---------- */
document.getElementById("btnOpt").onclick=function(){buildOptUI();openPanel("optPanel")};
document.getElementById("optClose").onclick=function(){closePanel("optPanel")};
document.getElementById("btnGrid").onclick=function(){buildGrid(document.getElementById("gridBox"),function(){closePanel("gridPanel")});openPanel("gridPanel")};
document.getElementById("gridClose").onclick=function(){closePanel("gridPanel")};
document.getElementById("zoomClose").onclick=function(){closePanel("zoom")};
document.getElementById("zoom").onclick=function(e){if(e.target.id==="zoom")closePanel("zoom")};
document.getElementById("defClose").onclick=hideDef;
document.getElementById("defHear").onclick=function(){
  var t=document.getElementById("def").getAttribute("data-say");
  if(t&&synth){try{synth.cancel()}catch(e){};setTimeout(function(){speakRaw(t)},60)}
};
main.addEventListener("click",function(e){
  var w=e.target.closest&&e.target.closest(".w"); if(!w)return;
  showDef(w.getAttribute("data-w"),w.textContent);
});
main.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("w")){e.preventDefault();showDef(e.target.getAttribute("data-w"),e.target.textContent)}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){["optPanel","gridPanel","zoom"].forEach(closePanel);hideDef()}
});

/* ---------- go ---------- */
applyOpts();
initState();
render();
startTicker();
})();
</script>
</body>
